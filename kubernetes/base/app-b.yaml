apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b
  namespace: sre-demo
  labels: {app: app-b}
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: app-b}
  template:
    metadata:
      labels: {app: app-b}
    spec:
      serviceAccountName: sre-app
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app-b
          image: APP_B_IMAGE
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: APP_NAME, value: app-b}
            - {name: CLUSTER_NAME, value: CLUSTER_NAME_VALUE}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: app-b
  namespace: sre-demo
  labels: {app: app-b}
spec:
  type: LoadBalancer
  selector: {app: app-b}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-b
  namespace: sre-demo
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: app-b}
  minReplicas: 3
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}

