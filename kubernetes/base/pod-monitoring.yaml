apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: app-a
  namespace: sre-demo
spec:
  selector:
    matchLabels: {app: app-a}
  endpoints:
    - {port: http, path: /metrics, interval: 30s}
